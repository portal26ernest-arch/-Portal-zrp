name: Build PORTAL Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "android_src/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android_src --stacktrace assembleDebug

      - name: Prepare named APK
        shell: bash
        run: |
          cp android_src/app/build/outputs/apk/debug/app-debug.apk PORTAL_Android_2026.09.23-b001.apk
          sha256sum PORTAL_Android_2026.09.23-b001.apk > PORTAL_Android_2026.09.23-b001.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PORTAL_Android_2026.09.23-b001
          path: |
            PORTAL_Android_2026.09.23-b001.apk
            PORTAL_Android_2026.09.23-b001.apk.sha256
          if-no-files-found: error
          retention-days: 30
