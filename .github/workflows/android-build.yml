name: Build PORTAL Android APK

on:
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: "Temporary HTTPS staging API URL for this artifact"
        required: false
        default: ""
        type: string
  push:
    branches: [ "main", "portal-next-b003", "codex-documents-excel-part4", "codex-communications-news-part5", "assistant-release-3.4-candidate", "codex-finalization-megapack-part12", "codex/production-cutover" ]
    paths:
      - "android_src/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Never pin an expiring tunnel in Git. Manual runs may inject the current
      # HTTPS staging URL; repository variables can provide a stable staging host.
      # Otherwise the APK starts disconnected and the user selects the server in Settings.
      PORTAL_STAGING_API_URL: ${{ github.event.inputs.staging_api_url || vars.PORTAL_STAGING_API_URL || 'https://portal.invalid' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify Android build security policy
        run: node android_src/tests/build-security.test.cjs
      - name: Verify employee creation modes
        run: node android_src/tests/employee-create-mode.test.cjs
      - name: Verify native fullscreen shell
        run: node android_src/tests/native-shell.test.cjs
      - name: Verify retired runtime boundary
        run: node android_src/tests/legacy-boundary.test.cjs
      - name: Verify documents and chat Android bridge
        run: node android_src/tests/documents-chat.test.cjs
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build isolated staging APK
        run: gradle -p android_src --stacktrace -PportalApiUrl="$PORTAL_STAGING_API_URL" assembleStaging
      - name: Verify isolated staging APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android_src/app/build/outputs/apk/staging -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -q "^package: name='ru.portal.app.staging'.*versionCode='35'.*versionName='3.5-dev-staging'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Prepare named APK
        id: artifact
        shell: bash
        run: |
          VERSION=$(sed -n 's/^versionName=//p' android_src/release.properties | tr -d '\r')
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]
          NAME="PORTAL_Android_${VERSION}_staging"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          APK=$(find android_src/app/build/outputs/apk/staging -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" "$NAME.apk"
          APK_SHA256=$(sha256sum "$NAME.apk" | awk '{print $1}')
          printf '%s  %s\n' "$APK_SHA256" "$NAME.apk" > "$NAME.apk.sha256"
          echo "artifact_name=${NAME}_${APK_SHA256}" >> "$GITHUB_OUTPUT"
          {
            echo "## PORTAL staging APK"
            echo "- Version: 3.5-dev-staging (versionCode 35; build 3.5)"
            echo "- Artifact: $NAME"
            echo "- APK SHA-256: $APK_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
          sed 's/^versionName=.*/versionName=3.5-dev-staging/' android_src/release.properties > "$NAME.version.properties"
          cp PORTAL_PART12_CHANGELOG.md "$NAME.changelog.md"
          cat > "$NAME.test-report.txt" <<'REPORT'
          PORTAL 3.5-dev-staging artifact validation
          This report is emitted only after the workflow's set -e validation steps pass.
          Passed: node android_src/tests/build-security.test.cjs
          Passed: node android_src/tests/employee-create-mode.test.cjs
          Passed: node android_src/tests/native-shell.test.cjs
          Passed: node android_src/tests/legacy-boundary.test.cjs
          Passed: node android_src/tests/documents-chat.test.cjs
          Passed: Gradle assembleStaging
          Passed: Android package/version metadata check (ru.portal.app.staging, 3.5-dev-staging, 35)
          Passed: apksigner verify --verbose
          Detailed CI results are available in the GitHub Actions run containing this artifact.
          REPORT
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            ${{ steps.artifact.outputs.name }}.apk
            ${{ steps.artifact.outputs.name }}.apk.sha256
            ${{ steps.artifact.outputs.name }}.version.properties
            ${{ steps.artifact.outputs.name }}.changelog.md
            ${{ steps.artifact.outputs.name }}.test-report.txt
          if-no-files-found: error
          retention-days: 30
