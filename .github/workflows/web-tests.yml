name: PORTAL Web checks

on:
  push:
    branches: ["main", "codex-desktop-web-part7", "assistant-release-3.4-candidate", "assistant-part10-web-invoice-e2e", "assistant-part11-web-template-download", "codex-finalization-megapack-part12", "codex/part12-employee-id"]
    paths:
      - "server/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/web-*.cjs"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/web-*.cjs"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  documents-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: portal-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_DOCUMENTS_PG_INTEGRATION: "1"
      PORTAL_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:portal-ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements-test.txt "psycopg[binary]==3.2.10"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m unittest test_documents_postgresql -v
        working-directory: server

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r server/requirements-test.txt
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest server.test_web_static server.test_portal_app_server -v
      - run: node --check android_src/tests/web-postgresql-part10.playwright.cjs
      - run: node --check android_src/tests/web-postgresql-part11-template-download.playwright.cjs
      - run: node --test android_src/tests/web-adapter.test.cjs android_src/tests/web-share.test.cjs android_src/tests/web-smoke.playwright.cjs
