name: Security hardening

on:
  pull_request:
  push:
    branches:
      - main
      - 'assistant/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  repository-security:
    name: Vulnerabilities and misconfigurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit production requirements
        run: python -m pip_audit -r server/requirements.txt
      - name: Audit test requirements
        run: python -m pip_audit -r server/requirements-test.txt

  workflow-and-shell:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # SC1090 is expected for the intentionally dynamic certbot ENV_FILE source path.\n          find ops -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x -e SC1090
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
