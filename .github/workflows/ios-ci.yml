name: iOS CI

on:
  push:
    branches:
      - main
      - 'assistant/**'
    paths:
      - 'ios_src/**'
      - 'android_src/app/src/main/assets/**'
      - 'android_src/release.properties'
      - '.github/workflows/ios-ci.yml'
      - 'PORTAL_MASTER_ROADMAP.md'
  pull_request:
    paths:
      - 'ios_src/**'
      - 'android_src/app/src/main/assets/**'
      - 'android_src/release.properties'
      - '.github/workflows/ios-ci.yml'
      - 'PORTAL_MASTER_ROADMAP.md'

permissions:
  contents: read

jobs:
  ios-build-test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26+
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          text=subprocess.check_output(['xcodebuild','-version'], text=True)
          match=re.search(r'Xcode (\\d+)', text)
          assert match and int(match.group(1)) >= 26, text
          PY

      - name: Check Android iOS parity contract
        run: python3 ios_src/tools/check_mobile_parity.py

      - name: Validate App Store release configuration
        run: |
          python3 ios_src/tools/validate_release_config.py
          python3 ios_src/tools/test_validate_release_config.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios_src
        run: xcodegen generate

      - name: Build iOS app without signing
        working-directory: ios_src
        run: |
          xcodebuild \
            -project PortalIOS.xcodeproj \
            -scheme PortalIOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run iOS unit tests
        working-directory: ios_src
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime,items in d.items() if ".iOS-" in runtime for x in items if x.get("isAvailable")))')"
          xcodebuild \
            -project PortalIOS.xcodeproj \
            -scheme PortalIOS \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Verify privacy manifest in built app
        working-directory: ios_src
        run: |
          APP="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/PortalIOS.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' "$APP/PrivacyInfo.xcprivacy" | grep -qx false
