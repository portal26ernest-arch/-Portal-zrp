name: PORTAL Android UI tests
on:
  workflow_dispatch:
  push:
    branches: ["portal-next-b003"]
    paths: ["android_src/**", ".github/workflows/android-ui-tests.yml"]
  pull_request:
    paths: ["android_src/**", ".github/workflows/android-ui-tests.yml"]
permissions:
  contents: read
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test android_src/tests/ui.test.cjs
