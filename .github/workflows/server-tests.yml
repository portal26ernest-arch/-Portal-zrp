name: PORTAL server isolation tests

on:
  workflow_dispatch:
  push:
    branches: ["portal-next-b003", "assistant-release-3.4-candidate"]
    paths: ["server/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-tests.yml"]

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install independent XLSX reader for tests
        run: python -m pip install -r server/requirements-test.txt
      - name: Run regression and isolation tests over HTTP
        env:
          PORTAL_TEST_HTTP: "1"
        run: python -m unittest discover -s server -p 'test_*.py' -v
