name: PORTAL relay reachability

on:
  push:
    branches:
      - assistant/portal48-relay-ticket-backport-20261006

jobs:
  relay-edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose public relay ingress
        shell: bash
        run: |
          set -u
          for url in \
            http://relay.vart-portal.ru/ \
            https://relay.vart-portal.ru/ \
            https://relay.vart-portal.ru:9443/; do
            echo "=== $url ==="
            curl -v -sS -o /dev/null -w 'status=%{http_code} verify=%{ssl_verify_result} remote=%{remote_ip}\n' --connect-timeout 5 --max-time 10 "$url" 2>&1 | tail -20 || true
          done
