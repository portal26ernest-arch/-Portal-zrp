name: Build signed PORTAL Android release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Что изменилось в этой версии"
        required: false
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PORTAL_PUBLIC_API_URL: https://api.vart-portal.ru
      PORTAL_ANDROID_KEYSTORE_TYPE: PKCS12
      PORTAL_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require manual release from current reviewed main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enforce release security policy
        run: node android_src/tests/build-security.test.cjs
      - name: Validate release inputs
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PORTAL_ANDROID_KEYSTORE_B64 }}
          PORTAL_ANDROID_STORE_PASSWORD: ${{ secrets.PORTAL_ANDROID_STORE_PASSWORD }}
          PORTAL_ANDROID_KEY_ALIAS: ${{ secrets.PORTAL_ANDROID_KEY_ALIAS }}
          PORTAL_ANDROID_KEY_PASSWORD: ${{ secrets.PORTAL_ANDROID_KEY_PASSWORD }}
          PORTAL_ANDROID_CERT_SHA256: ${{ secrets.PORTAL_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$PORTAL_PUBLIC_API_URL" == https://* ]]
          API_HOST="${PORTAL_PUBLIC_API_URL#https://}"
          API_HOST="${API_HOST%%/*}"
          API_HOST="${API_HOST%%:*}"
          test "$API_HOST" = "api.vart-portal.ru"
          test -n "$KEYSTORE_B64"
          test -n "$PORTAL_ANDROID_STORE_PASSWORD"
          test -n "$PORTAL_ANDROID_KEY_ALIAS"
          test -n "$PORTAL_ANDROID_KEY_PASSWORD"
          test -n "$PORTAL_ANDROID_CERT_SHA256"
          VERSION=$(sed -n 's/^versionName=//p' android_src/release.properties | tr -d '\r')
          VERSION_CODE=$(sed -n 's/^versionCode=//p' android_src/release.properties | tr -d '\r')
          CHANNEL=$(sed -n 's/^channel=//p' android_src/release.properties | tr -d '\r')
          UPDATE_MANIFEST_URL=$(sed -n 's/^updateManifestUrl=//p' android_src/release.properties | tr -d '\r')
          [[ "$VERSION" != *-dev* ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          test "$VERSION_CODE" -gt 2
          test "$CHANNEL" = "release"
          EXPECTED_MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/portal-update.json"
          test "$UPDATE_MANIFEST_URL" = "$EXPECTED_MANIFEST_URL"
          test "$PORTAL_ANDROID_KEYSTORE_TYPE" = "PKCS12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/portal-release.p12"
          chmod 600 "$RUNNER_TEMP/portal-release.p12"
          echo "PORTAL_ANDROID_KEYSTORE=$RUNNER_TEMP/portal-release.p12" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed HTTPS release
        env:
          PORTAL_ANDROID_STORE_PASSWORD: ${{ secrets.PORTAL_ANDROID_STORE_PASSWORD }}
          PORTAL_ANDROID_KEY_ALIAS: ${{ secrets.PORTAL_ANDROID_KEY_ALIAS }}
          PORTAL_ANDROID_KEY_PASSWORD: ${{ secrets.PORTAL_ANDROID_KEY_PASSWORD }}
        run: gradle -p android_src --stacktrace -PportalApiUrl="$PORTAL_PUBLIC_API_URL" assembleRelease
      - name: Verify and name release
        id: artifact
        shell: bash
        env:
          PORTAL_ANDROID_CERT_SHA256: ${{ secrets.PORTAL_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(find android_src/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -q "^package: name='ru.portal.app'" <<< "$BADGING"
          VERSION=$(sed -n 's/^versionName=//p' android_src/release.properties | tr -d '\r')
          VERSION_CODE=$(sed -n 's/^versionCode=//p' android_src/release.properties | tr -d '\r')
          grep -q "^package:.*versionCode='$VERSION_CODE'.*versionName='$VERSION'" <<< "$BADGING"
          CERT_INFO=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERT_INFO"
          ! printf '%s\n' "$CERT_INFO" | grep -q "Android Debug"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ' :\r\n')
          EXPECTED_CERT=$(printf '%s' "$PORTAL_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ' :\r\n')
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          VERSION=$(sed -n 's/^versionName=//p' android_src/release.properties | tr -d '\r')
          NAME="PORTAL_Android_${VERSION}_release"
          TAG="portal-android-v${VERSION}"
          cp "$APK" "$NAME.apk"
          sha256sum "$NAME.apk" > "$NAME.apk.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Сформировать manifest обновления
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.artifact.outputs.name }}"
          TAG="${{ steps.artifact.outputs.tag }}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}.apk"
          NOTES="${PORTAL_RELEASE_NOTES:-Обновление PORTAL.}"
          python android_src/tools/build_update_manifest.py             --apk "${NAME}.apk"             --apk-url "$APK_URL"             --changelog "$NOTES"             --out portal-update.json
          python -m json.tool portal-update.json >/dev/null
          python android_src/tools/validate_release_artifact.py --properties android_src/release.properties --apk "${NAME}.apk" --manifest portal-update.json --repository "$GITHUB_REPOSITORY" --tag "$TAG"

      - name: Опубликовать GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.artifact.outputs.name }}"
          TAG="${{ steps.artifact.outputs.tag }}"
          VERSION=$(sed -n 's/^versionName=//p' android_src/release.properties | tr -d '\r')
          NOTES="${PORTAL_RELEASE_NOTES:-Обновление PORTAL.}"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" "$NAME.apk" "$NAME.apk.sha256" portal-update.json             --target "$GITHUB_SHA"             --title "PORTAL Android $VERSION"             --notes "$NOTES"             --latest

      - name: Remove signing material from runner
        if: always()
        shell: bash
        run: |
          if [ -n "${PORTAL_ANDROID_KEYSTORE:-}" ]; then rm -f -- "$PORTAL_ANDROID_KEYSTORE"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.name }}.apk
            ${{ steps.artifact.outputs.name }}.apk.sha256
            portal-update.json
          if-no-files-found: error
          retention-days: 30
