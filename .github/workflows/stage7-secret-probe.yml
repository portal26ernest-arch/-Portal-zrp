name: Stage 7 secret presence probe

on:
  push:
    branches:
      - assistant-stage7-verify
    paths:
      - ".github/workflows/stage7-secret-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report secret presence only
        shell: bash
        env:
          PORTAL_VPS_SSH_KEY: ${{ secrets.PORTAL_VPS_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PORTAL_SSH_KEY: ${{ secrets.PORTAL_SSH_KEY }}
          PORTAL_VPS_HOST: ${{ secrets.PORTAL_VPS_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PORTAL_VPS_USER: ${{ secrets.PORTAL_VPS_USER }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PORTAL_VPS_KNOWN_HOSTS: ${{ secrets.PORTAL_VPS_KNOWN_HOSTS }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in             PORTAL_VPS_SSH_KEY VPS_SSH_KEY SSH_PRIVATE_KEY PORTAL_SSH_KEY             PORTAL_VPS_HOST VPS_HOST PORTAL_VPS_USER VPS_USER             PORTAL_VPS_KNOWN_HOSTS VPS_KNOWN_HOSTS
          do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
