name: PORTAL Windows Desktop build

on:
  push:
    branches: ["main", "assistant/**", "codex-finalization-megapack-part12", "codex/desktop-client-connection"]
    tags: ["portal-desktop-v*"]
    paths:
      - "desktop_windows/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/desktop-shell.test.cjs"
      - "ops/install_portal_desktop.ps1"
      - "ops/test_portal_desktop_installer.ps1"
      - "ops/PORTAL_WINDOWS_DESKTOP.md"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "desktop_windows/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/desktop-shell.test.cjs"
      - "ops/install_portal_desktop.ps1"
      - "ops/test_portal_desktop_installer.ps1"
      - "ops/PORTAL_WINDOWS_DESKTOP.md"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  windows-desktop:
    outputs:
      version: ${{ steps.meta.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Resolve Desktop version
        id: meta
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath "desktop_windows/Portal.Desktop.csproj" -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Desktop version is missing" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Validate installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "ops/install_portal_desktop.ps1"), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Publish self-contained Windows client
        run: dotnet publish desktop_windows/Portal.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.version }}-ci -o artifacts/desktop
      - name: Package and checksum CI artifact
        shell: pwsh
        run: |
          $package = "PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip"
          Compress-Archive -Path "artifacts/desktop/*" -DestinationPath $package
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.sha256" -Value "$hash  $package" -NoNewline
      - name: Exercise installer safety contracts
        shell: pwsh
        run: .\ops\test_portal_desktop_installer.ps1 -InstallerPath .\ops\install_portal_desktop.ps1
      - name: Install packaged app into disposable per-user profile
        shell: pwsh
        run: .\ops\install_portal_desktop.ps1 -PackagePath .\PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip -Version ${{ steps.meta.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}
          path: |
            PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip
            PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/portal-desktop-v')
    needs: windows-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PORTAL-Desktop-win-x64-${{ needs.windows-desktop.outputs.version }}
          path: release
      - name: Validate tag and publish stable update package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows-desktop.outputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "portal-desktop-v${VERSION}"
          package="PORTAL-Desktop-win-x64-${VERSION}.zip"
          test -f "release/${package}"
          test -f "release/${package}.sha256"
          gh release create "${GITHUB_REF_NAME}" "release/${package}" "release/${package}.sha256" \
            --latest=false \
            --title "PORTAL Desktop ${VERSION}" \
            --notes "Официальное обновление PORTAL Desktop ${VERSION}. Устанавливается через кнопку «Обновить PORTAL» внутри приложения."
