name: PORTAL Windows Desktop build

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Что изменилось в этой версии"
        required: false
        type: string
  push:
    branches: ["main", "assistant/**", "codex-finalization-megapack-part12", "codex/desktop-client-connection"]
    paths:
      - "desktop_windows/**"
      - "desktop_windows.Tests/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/desktop-shell.test.cjs"
      - "android_src/tests/build-security.test.cjs"
      - "ops/install_portal_desktop.ps1"
      - "ops/test_portal_desktop_installer.ps1"
      - "ops/PORTAL_WINDOWS_DESKTOP.md"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "desktop_windows/**"
      - "desktop_windows.Tests/**"
      - "android_src/app/src/main/assets/**"
      - "android_src/tests/desktop-shell.test.cjs"
      - "android_src/tests/build-security.test.cjs"
      - "ops/install_portal_desktop.ps1"
      - "ops/test_portal_desktop_installer.ps1"
      - "ops/PORTAL_WINDOWS_DESKTOP.md"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  windows-desktop:
    outputs:
      version: ${{ steps.meta.outputs.version }}
      update_build: ${{ steps.meta.outputs.update_build }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require manual release from current reviewed main
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Desktop release must be dispatched from main" }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main for release validation" }
          $mainCommit = (git rev-parse refs/remotes/origin/main).Trim()
          if ($env:GITHUB_SHA -ne $mainCommit) { throw "Desktop release must use the current reviewed main commit" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Enforce complete Desktop module navigation
        run: node android_src/tests/desktop-shell.test.cjs
      - name: Verify Desktop update signatures
        run: dotnet run --project desktop_windows.Tests/Portal.Desktop.UpdateSignature.Tests.csproj --configuration Release
      - name: Resolve Desktop version
        id: meta
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath "desktop_windows/Portal.Desktop.csproj" -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          $fileVersion = [string]$project.Project.PropertyGroup.FileVersion
          $updateBuild = [string]$project.Project.PropertyGroup.PortalUpdateBuild
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Desktop version is missing" }
          if ($updateBuild -notmatch '^[1-9][0-9]*$') { throw "Desktop updater build is missing or invalid" }
          if ($fileVersion -ne "$version.$updateBuild") { throw "Desktop FileVersion must be <Version>.<PortalUpdateBuild>" }
          $mainWindow = Get-Content -LiteralPath "desktop_windows/MainWindow.xaml.cs" -Raw
          if ($mainWindow -notmatch "private const int CurrentBuild = $updateBuild;") { throw "Desktop CurrentBuild must equal PortalUpdateBuild" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "update_build=$updateBuild" >> $env:GITHUB_OUTPUT
      - name: Validate installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "ops/install_portal_desktop.ps1"), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Publish self-contained Windows client
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          dotnet publish desktop_windows/Portal.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=${{ steps.meta.outputs.version }} -p:InformationalVersion=${{ steps.meta.outputs.version }}-ci -p:PortalBuildNumber=$env:GITHUB_RUN_NUMBER -p:PortalBuildDate=$buildDate -o artifacts/desktop
      - name: Package and checksum CI artifact
        shell: pwsh
        run: |
          $package = "PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip"
          Compress-Archive -Path "artifacts/desktop/*" -DestinationPath $package
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.sha256" -Value "$hash  $package" -NoNewline
      - name: Exercise installer safety contracts
        shell: pwsh
        run: .\ops\test_portal_desktop_installer.ps1 -InstallerPath .\ops\install_portal_desktop.ps1
      - name: Install packaged app into disposable per-user profile
        shell: pwsh
        run: .\ops\install_portal_desktop.ps1 -PackagePath .\PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip -Version ${{ steps.meta.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}
          path: |
            PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip
            PORTAL-Desktop-win-x64-${{ steps.meta.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: windows-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck reviewed main before signing and publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
      - uses: actions/download-artifact@v4
        with:
          name: PORTAL-Desktop-win-x64-${{ needs.windows-desktop.outputs.version }}
          path: release
      - name: Create signed Desktop update manifest
        shell: bash
        env:
          PORTAL_DESKTOP_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.PORTAL_DESKTOP_UPDATE_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ needs.windows-desktop.outputs.version }}
          BUILD: ${{ needs.windows-desktop.outputs.update_build }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PORTAL_DESKTOP_UPDATE_SIGNING_PRIVATE_KEY"
          key="$RUNNER_TEMP/portal-desktop-update-signing.pem"
          payload="$RUNNER_TEMP/portal-desktop-update.payload"
          signature="$RUNNER_TEMP/portal-desktop-update.signature"
          trap 'rm -f "$key" "$payload" "$signature"' EXIT
          printf '%s' "$PORTAL_DESKTOP_UPDATE_SIGNING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          package="PORTAL-Desktop-win-x64-${VERSION}.zip"
          tag="portal-desktop-v${VERSION}"
          sha256=$(awk '{print tolower($1)}' "release/${package}.sha256")
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]
          build="$BUILD"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${package}"
          printf 'PORTAL-DESKTOP-UPDATE-V1\n%s\n%s\n%s\n%s\n' "$build" "$VERSION" "$download_url" "$sha256" > "$payload"
          openssl dgst -sha256 -sign "$key" -out "$signature" "$payload"
          signature_b64=$(base64 -w0 "$signature")
          python - "$build" "$VERSION" "$download_url" "$sha256" "$signature_b64" > release/portal-desktop-update.json <<'PY'
          import json, sys
          build, version, url, sha256, signature = sys.argv[1:]
          print(json.dumps({"build": int(build), "version": version, "download_url": url,
                            "sha256": sha256, "signature": signature}, separators=(",", ":")))
          PY
      - name: Publish immutable Desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows-desktop.outputs.version }}
        run: |
          set -euo pipefail
          TAG="portal-desktop-v${VERSION}"
          NOTES="${{ inputs.release_notes }}"
          NOTES="${NOTES:-Официальное обновление PORTAL Desktop ${VERSION}.}"
          package="PORTAL-Desktop-win-x64-${VERSION}.zip"
          test -f "release/${package}"
          test -f "release/${package}.sha256"
          test -f "release/portal-desktop-update.json"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" "release/${package}" "release/${package}.sha256" "release/portal-desktop-update.json" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "PORTAL Desktop ${VERSION}" \
            --notes "$NOTES"
