global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: portal
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Same-host monitoring must not hairpin through Cloudflare.
  # Public Cloudflare reachability is checked independently by GitHub Actions.
  - job_name: portal-origin-api
    metrics_path: /probe
    params:
      module: [http_api_origin_2xx]
    static_configs:
      - targets:
          - https://178.209.127.247:8443/api/ping
        labels:
          portal_endpoint: https://api.vart-portal.ru/api/ping
      - targets:
          - https://178.209.127.247:8443/api/ready
        labels:
          portal_endpoint: https://api.vart-portal.ru/api/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [portal_endpoint]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: portal-origin-site
    metrics_path: /probe
    params:
      module: [http_site_origin_2xx]
    static_configs:
      - targets:
          - https://178.209.127.247/web/
        labels:
          portal_endpoint: https://vart-portal.ru/web/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [portal_endpoint]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: portal-ssh
    metrics_path: /probe
    params:
      module: [ssh_banner]
    static_configs:
      - targets:
          - 178.209.127.247:22
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
