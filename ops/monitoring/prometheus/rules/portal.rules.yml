groups:
  - name: portal-availability
    rules:
      - alert: PortalEndpointDown
        expr: probe_success{job="portal-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PORTAL endpoint unavailable"
          description: "{{ $labels.instance }} has failed probes for more than 2 minutes."

      - alert: PortalTlsExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="portal-http"} - time()) < 14 * 24 * 60 * 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PORTAL TLS certificate expires soon"
          description: "{{ $labels.instance }} certificate has less than 14 days remaining."

      - alert: PortalSshBannerDown
        expr: probe_success{job="portal-ssh"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PORTAL SSH service is not completing its banner handshake"
          description: "{{ $labels.instance }} accepts no valid SSH-2.0 banner for more than 2 minutes."

  - name: portal-host
    rules:
      - alert: PortalNodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PORTAL host metrics unavailable"
          description: "node_exporter has been unreachable for more than 2 minutes."

      - alert: PortalCpuHigh
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PORTAL host CPU usage high"
          description: "Average CPU utilization has exceeded 90% for 10 minutes."

      - alert: PortalMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PORTAL host memory usage high"
          description: "Memory utilization has exceeded 90% for 10 minutes."

      - alert: PortalDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PORTAL host disk space low"
          description: "{{ $labels.mountpoint }} has less than 10% free space."
