services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0
    container_name: portal-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - node-exporter
      - blackbox-exporter
      - alertmanager

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: portal-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: portal-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.34.1
    container_name: portal-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.3
    container_name: portal-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-portal-admin}"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${PORTAL_MONITORING_SECRETS_DIR:-/etc/portal-monitoring/secrets}/grafana_admin_password:/run/secrets/grafana_admin_password:ro
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus

  uptime-kuma:
    image: ghcr.io/louislam/uptime-kuma:2.5.5
    container_name: portal-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [portal-monitoring]
    security_opt:
      - no-new-privileges:true

networks:
  portal-monitoring:
    name: portal-monitoring
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  uptime_kuma_data:
