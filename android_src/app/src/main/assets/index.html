<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>PORTAL</title><link rel="stylesheet" href="ui.css"><script src="web_adapter.js" defer></script><script src="core.js" defer></script><script src="app.js" defer></script><script src="screens.js" defer></script><script src="production.js" defer></script><script src="preview.js" defer></script><script src="invoices.js" defer></script><script src="documents_excel.js" defer></script></head><body>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<section id="auth" class="auth-shell" aria-label="Вход в PORTAL">
<header class="auth-top"><div class="row"><span class="portal-symbol" data-icon="portal"></span><span class="wordmark">PORTAL</span></div><button class="icon-button" data-action="serverSettings" aria-label="Настройки подключения" data-icon="settings"></button></header>
<div class="auth-content"><span class="eyebrow">Ваш рабочий день</span><h1>Всё на своём месте.</h1><p class="muted auth-intro">Работа, команда и результаты — в одном пространстве.</p>
<div class="card auth-card"><button id="loginCompany" class="company-selector" data-action="loginOptions"><span>Компания · PORTAL</span><span data-icon="chevron"></span></button>
<form id="loginForm"><label class="field"><span>Логин</span><input id="loginUser" autocomplete="username" autocapitalize="none" required maxlength="200" placeholder="Ваш логин"></label>
<label class="field"><span id="passwordLabel">Код доступа</span><span class="password-field"><input id="loginPin" type="password" autocomplete="current-password" required maxlength="128" placeholder="Введите PIN или пароль"><button type="button" data-action="togglePassword" aria-label="Показать код доступа" data-icon="eye"></button></span></label>
<p id="loginError" class="signin-error hidden" role="alert"></p><button class="btn block" id="loginSubmit" type="submit">Войти <span data-icon="arrow"></span></button></form><button class="btn text block" data-action="acceptInvite">У меня есть приглашение</button>
<div id="setupBox" class="hidden"><h2>Добро пожаловать</h2><p class="muted">Создайте первый доступ администратора компании.</p><button class="btn block" data-action="setup">Создать администратора</button></div>
<p class="auth-status" id="serverState" role="status">Проверяем подключение…</p><button class="btn secondary block auth-update-button" id="authUpdateButton" type="button" data-action="checkUpdates"><span data-icon="refresh"></span> Проверить обновление</button><div id="authUpdateState" class="update-state auth-update-state" role="status"></div></div><p id="buildLabel" class="dev-label"></p></div><footer id="authCredit" class="auth-footer"></footer></section>
<div id="app" class="hidden"><header class="top"><div class="top-inner"><span class="portal-symbol" data-icon="portal"></span><div class="grow"><div class="wordmark">PORTAL</div><div id="companyName" class="company-name"></div></div><button id="profileButton" class="icon-button" data-action="profile" aria-label="Профиль"><span id="initials"></span></button></div></header>
<div id="supportStrip" class="support-strip hidden"></div><main id="content" class="main" tabindex="-1"></main><nav id="nav" class="nav" aria-label="Основная навигация"></nav></div>
<div id="sheetBackdrop" class="sheet-backdrop hidden"><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><div class="sheet-header"><h2 id="sheetTitle"></h2><button class="icon-button" data-action="closeSheet" aria-label="Закрыть" data-icon="close"></button></div><div id="sheetContent"></div></section></div>
</body></html>
