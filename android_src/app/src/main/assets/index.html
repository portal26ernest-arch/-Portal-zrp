<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>PORTAL</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#172033;--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--cyan:#22d3ee;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--line:#253047;--shadow:0 14px 40px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1220 180px);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:14px;background:radial-gradient(circle at 30% 25%,#60a5fa,#2563eb 50%,#1e3a8a);display:grid;place-items:center;font-weight:900;font-size:23px;box-shadow:0 8px 28px rgba(37,99,235,.35)}.brand h1{font-size:20px;margin:0;letter-spacing:.06em}.sub{font-size:12px;color:var(--muted)}.main{padding:16px 16px 110px;max-width:850px;margin:auto}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:14px;border-radius:16px;background:#0f172a;border:1px solid #24314b}.metric .n{font-size:22px;font-weight:800;margin-top:4px}.metric .l{font-size:12px;color:var(--muted)}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.btn{border:0;border-radius:14px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:700;font-size:14px}.btn.secondary{background:#24314b}.btn.good{background:#15803d}.btn.warn{background:#b45309}.btn.danger{background:#b91c1c}.btn.block{width:100%}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}input,select,textarea{width:100%;border-radius:13px;border:1px solid #334155;background:#0f172a;color:#fff;padding:12px 13px;font-size:16px;outline:none}textarea{min-height:84px}.field{margin:0 0 12px}.label{font-size:12px;color:var(--muted);margin:0 0 6px}.list{display:flex;flex-direction:column;gap:8px}.item{background:#0f172a;border:1px solid #26334d;border-radius:14px;padding:12px}.item .title{font-weight:750}.item .meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;background:#24314b;color:#dbeafe}.badge.green{background:#14532d;color:#dcfce7}.badge.red{background:#7f1d1d;color:#fee2e2}.badge.amber{background:#78350f;color:#fef3c7}.nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(8,14,25,.97);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:3px}.nav button{flex:1;min-width:68px;border:0;background:transparent;color:#94a3b8;padding:7px 4px;border-radius:12px;font-size:11px}.nav button b{display:block;font-size:20px;line-height:22px}.nav button.active{color:#fff;background:#1d4ed8}.toast{position:fixed;top:85px;left:18px;right:18px;z-index:99;padding:13px 15px;border-radius:13px;background:#1e293b;border:1px solid #475569;box-shadow:var(--shadow);display:none}.toast.err{background:#450a0a;border-color:#991b1b}.empty{text-align:center;color:var(--muted);padding:22px}.splash{min-height:100vh;display:grid;place-items:center;padding:28px}.login{width:min(430px,100%)}.heroLogo{width:82px;height:82px;border-radius:28px;margin:0 auto 20px;background:radial-gradient(circle at 28% 22%,#67e8f9,#2563eb 55%,#172554);display:grid;place-items:center;font-size:46px;font-weight:900;box-shadow:0 18px 55px rgba(37,99,235,.45)}.center{text-align:center}.muted{color:var(--muted)}.hidden{display:none!important}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.click{cursor:pointer}.money{font-variant-numeric:tabular-nums}.hr{height:1px;background:var(--line);margin:14px 0}.serverBad{color:#fca5a5}.serverGood{color:#86efac}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:850px;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="auth" class="splash">
  <div class="login">
    <div class="heroLogo">P</div>
    <h1 class="center" style="letter-spacing:.12em">PORTAL</h1>
    <p class="center muted">Fulfillment Control</p>
    <div class="card" id="authCard">
      <div id="serverState" class="muted" style="margin-bottom:12px">Проверяю сервер…</div>
      <div id="setupBox" class="hidden">
        <h2>Первый запуск</h2><p class="muted">Создайте администратора приложения. Этот PIN будет использоваться только в PORTAL Android.</p>
        <div class="field"><div class="label">Логин</div><input id="setupUser" value="admin"></div>
        <div class="field"><div class="label">Имя</div><input id="setupName" value="Администратор PORTAL"></div>
        <div class="field"><div class="label">PIN (минимум 4 символа)</div><input id="setupPin" type="password" inputmode="numeric"></div>
        <button class="btn block" onclick="setupAdmin()">Создать администратора</button>
      </div>
      <div id="loginBox" class="hidden">
        <h2>Вход</h2>
        <div class="field"><div class="label">Логин</div><input id="loginUser" autocomplete="username"></div>
        <div class="field"><div class="label">PIN</div><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password"></div>
        <button class="btn block" onclick="login()">Войти</button>
      </div>
      <div class="hr"></div>
      <button class="btn secondary block" onclick="openServerSettings()">⚙ Адрес сервера</button>
      <div class="center sub" style="margin-top:12px" id="buildLabel"></div>
    </div>
  </div>
</div>
<div id="app" class="hidden">
  <header class="top"><div class="brand"><div class="logo">P</div><div class="grow"><h1>PORTAL</h1><div class="sub" id="who"></div></div><button class="btn secondary" onclick="logout()" style="padding:9px 11px">Выйти</button></div></header>
  <main class="main" id="content"></main>
  <nav class="nav" id="nav"></nav>
</div>
<script>
const S={token:localStorage.portalToken||'',me:null,page:'dashboard',clients:[],selectedClient:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n||0))+' ₽';
const num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n||0));
function nativeReq(method,path,body){try{return JSON.parse(PortalNative.request(method,path,body?JSON.stringify(body):'',S.token||''));}catch(e){return {ok:false,error:String(e)}}}
function toast(msg,err=false){let t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function openServerSettings(){let cur=PortalNative.getServerUrl();let v=prompt('Адрес сервера PORTAL',cur);if(v){PortalNative.setServerUrl(v);checkServer()}}
function checkServer(){let r=nativeReq('GET','/api/ping');let st=document.getElementById('serverState');document.getElementById('buildLabel').textContent=PortalNative.getBuild();if(!r.ok){st.innerHTML='<span class="serverBad">● Сервер недоступен</span><br><span class="sub">'+esc(r.error||'Запустите portal_app_server.py в Termux')+'</span>';document.getElementById('setupBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');return}st.innerHTML='<span class="serverGood">● Сервер подключён</span><br><span class="sub">'+esc(r.build)+'</span>';document.getElementById('setupBox').classList.toggle('hidden',!r.setup_required);document.getElementById('loginBox').classList.toggle('hidden',r.setup_required);if(S.token){let me=nativeReq('GET','/api/me');if(me.ok){S.me=me.user;enterApp();}}}
function setupAdmin(){let r=nativeReq('POST','/api/setup',{username:setupUser.value.trim(),display_name:setupName.value.trim(),pin:setupPin.value});if(!r.ok)return toast(r.error,true);S.token=r.token;localStorage.portalToken=S.token;S.me=r.user;enterApp()}
function login(){let r=nativeReq('POST','/api/login',{username:loginUser.value.trim(),pin:loginPin.value});if(!r.ok)return toast(r.error,true);S.token=r.token;localStorage.portalToken=S.token;S.me=r.user;enterApp()}
function logout(){S.token='';S.me=null;localStorage.removeItem('portalToken');document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');checkServer()}
function enterApp(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=(S.me.display_name||S.me.username)+' · '+(S.me.role_label||S.me.role);buildNav();go('dashboard')}
function buildNav(){let role=S.me.role;let items=[['dashboard','⌂','Главная'],['work','＋','Работа'],['clients','◎','Клиенты'],['payroll','₽','Зарплата']];if(['admin','manager','accountant'].includes(role))items.push(['invoices','▤','Счета']);if(['admin','shift','accountant'].includes(role))items.push(['materials','▦','Склад']);items.push(['jobs','⚙','Задания']);if(role==='admin')items.push(['users','♙','Доступ']);items.push(['settings','⋯','Ещё']);document.getElementById('nav').innerHTML=items.map(x=>`<button data-page="${x[0]}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function go(page){S.page=page;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({dashboard:renderDashboard,work:renderWork,clients:renderClients,payroll:renderPayroll,invoices:renderInvoices,materials:renderMaterials,jobs:renderJobs,users:renderUsers,settings:renderSettings}[page]||renderDashboard)()}
function setContent(h){document.getElementById('content').innerHTML=h}
function renderDashboard(){let r=nativeReq('GET','/api/dashboard?period=current');if(!r.ok)return setContent(errCard(r));let d=r.data;setContent(`<div class="sectionHead"><h2>Текущий период</h2><button class="btn secondary" onclick="renderDashboard()">↻</button></div><div class="grid"><div class="metric"><div class="l">Выработка</div><div class="n">${num(d.quantity)}</div></div><div class="metric"><div class="l">Начислено</div><div class="n money">${money(d.salary)}</div></div><div class="metric"><div class="l">Выручка</div><div class="n money">${money(d.revenue)}</div></div><div class="metric"><div class="l">Дебиторка</div><div class="n money">${money(d.debt)}</div></div></div>${S.me.role==='admin'?`<div class="card"><h2>Экономика</h2><div class="row"><div class="grow muted">Прямые затраты</div><b>${money(d.direct_cost)}</b></div><div class="row"><div class="grow muted">Расчётная прибыль</div><b style="color:${d.profit>=0?'#86efac':'#fca5a5'}">${money(d.profit)}</b></div><div class="row"><div class="grow muted">Выставлено счетов</div><b>${money(d.invoiced)}</b></div><div class="row"><div class="grow muted">Получено оплат</div><b>${money(d.paid)}</b></div></div>`:''}<div class="card"><h2>Быстрые действия</h2><div class="grid"><button class="btn" onclick="go('work')">＋ Внести работу</button><button class="btn secondary" onclick="go('clients')">◎ Клиенты</button><button class="btn secondary" onclick="go('jobs')">⚙ Задания</button><button class="btn secondary" onclick="go('payroll')">₽ Зарплата</button></div></div>`)}
function errCard(r){return `<div class="card"><h2>Не удалось загрузить</h2><p class="serverBad">${esc(r.error||'Ошибка')}</p><button class="btn" onclick="go('${S.page}')">Повторить</button></div>`}
function loadClients(){let r=nativeReq('GET','/api/clients');if(r.ok)S.clients=r.clients;return r}
function renderWork(){let r=loadClients();if(!r.ok)return setContent(errCard(r));let options=S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');setContent(`<h2>Внести выполненную работу</h2><div class="card"><div class="field"><div class="label">Клиент</div><select id="wClient" onchange="loadOps()"><option value="">Выберите клиента</option>${options}</select></div><div class="field"><div class="label">Операция</div><select id="wOp"><option value="">Сначала выберите клиента</option></select></div><div class="field"><div class="label">Количество</div><input id="wQty" type="number" inputmode="numeric" min="1" placeholder="Например, 250"></div><button class="btn block" onclick="saveWork()">Сохранить выработку</button></div><div class="sectionHead"><h2>Последние записи</h2><button class="btn secondary" onclick="loadMyWork()">↻</button></div><div id="myWork"></div>`);loadMyWork()}
function loadOps(){let id=wClient.value;if(!id){wOp.innerHTML='<option>Сначала выберите клиента</option>';return}let r=nativeReq('GET',`/api/clients/${id}/operations`);if(!r.ok)return toast(r.error,true);wOp.innerHTML='<option value="">Выберите операцию</option>'+r.operations.map(o=>`<option value="${o.id}">${esc(o.name)} · ${o.employee_rate==null?'ставка не задана':money(o.employee_rate)}</option>`).join('')}
function saveWork(){let cid=wClient.value,oid=wOp.value,q=wQty.value;if(!cid||!oid||!q)return toast('Заполните клиент, операцию и количество',true);let r=nativeReq('POST','/api/work',{client_id:Number(cid),operation_id:Number(oid),quantity:Number(q)});if(!r.ok)return toast(r.error,true);toast('Сохранено · начислено '+money(r.work.salary));wQty.value='';loadMyWork();if(r.work.warnings?.length)toast('Низкий остаток: '+r.work.warnings.join(', '),true)}
function loadMyWork(){let r=nativeReq('GET','/api/work/mine');let el=document.getElementById('myWork');if(!el)return;if(!r.ok)return el.innerHTML=errCard(r);el.innerHTML=r.rows.length?'<div class="list">'+r.rows.map(x=>`<div class="item"><div class="title">${esc(x.client)} · ${esc(x.operation)}</div><div class="meta">${x.quantity} шт. × ${money(x.rate)} = <b>${money(x.salary)}</b><br>${esc(x.created_at)}</div></div>`).join('')+'</div>':'<div class="empty">Записей пока нет</div>'}
function renderClients(){let r=loadClients();if(!r.ok)return setContent(errCard(r));setContent(`<div class="sectionHead"><h2>Клиенты</h2><span class="badge">${S.clients.length}</span></div><div class="list">${S.clients.map(c=>`<div class="item click" onclick="openClient(${c.id})"><div class="title">${esc(c.name)}</div><div class="meta">Открыть карточку →</div></div>`).join('')}</div>`)}
function openClient(id){let r=nativeReq('GET',`/api/clients/${id}`);if(!r.ok)return toast(r.error,true);let c=r.client,s=r.stats,q=r.requisites||{};setContent(`<button class="btn secondary" onclick="renderClients()">← Клиенты</button><div style="height:12px"></div><div class="card"><h2>${esc(c.name)}</h2><div class="grid"><div class="metric"><div class="l">Обработано</div><div class="n">${num(s.quantity)}</div></div><div class="metric"><div class="l">Выручка</div><div class="n">${money(s.revenue)}</div></div><div class="metric"><div class="l">Счетов</div><div class="n">${num(s.invoices)}</div></div><div class="metric"><div class="l">Выставлено</div><div class="n">${money(s.invoiced)}</div></div></div></div><div class="card"><h2>Реквизиты</h2><div class="muted">${esc(q.legal_name||'Юр. название не заполнено')}</div><div>ИНН: ${esc(q.inn||'—')}</div><div>КПП: ${esc(q.kpp||'—')}</div><div>Контакт: ${esc(q.contact_person||'—')}</div><div>${esc(q.phone||'')}</div><div>${esc(q.email||'')}</div></div><button class="btn block" onclick="S.selectedClient=${id};go('work');setTimeout(()=>{wClient.value='${id}';loadOps()},50)">＋ Внести работу</button>`)}
function renderPayroll(){let r=nativeReq('GET','/api/payroll/mine');if(!r.ok)return setContent(errCard(r));let d=r.data;setContent(`<h2>Моя зарплата</h2><div class="grid"><div class="metric"><div class="l">Выработка</div><div class="n">${num(d.quantity)}</div></div><div class="metric"><div class="l">Начислено</div><div class="n">${money(d.accrued)}</div></div><div class="metric"><div class="l">Выплачено</div><div class="n">${money(d.paid)}</div></div><div class="metric"><div class="l">К выплате</div><div class="n">${money(d.remaining)}</div></div></div><div class="card"><div class="muted">Расчётный период</div><b>${esc((d.start||'').slice(0,10))} — ${esc((d.end||'').slice(0,10))}</b></div>`)}
function renderInvoices(){let r=nativeReq('GET','/api/invoices');if(!r.ok)return setContent(errCard(r));setContent(`<div class="sectionHead"><h2>Счета и дебиторка</h2><span class="badge">${r.invoices.length}</span></div><div class="list">${r.invoices.map(i=>{let debt=Math.max(Number(i.amount_due)-Number(i.paid||0),0);return `<div class="item"><div class="row"><div class="grow"><div class="title">№${i.id} · ${esc(i.client)}</div><div class="meta">${esc(i.description)}<br>${esc(i.created_at)} · срок: ${esc(i.due_date||'—')}</div></div><div style="text-align:right"><b>${money(i.amount_due)}</b><div class="badge ${debt>0?'red':'green'}">долг ${money(debt)}</div></div></div></div>`}).join('')||'<div class="empty">Счетов нет</div>'}</div>`)}
function renderMaterials(){let r=nativeReq('GET','/api/materials');if(!r.ok)return setContent(errCard(r));setContent(`<div class="sectionHead"><h2>Материалы</h2><span class="badge">${r.materials.length}</span></div><div class="list">${r.materials.map(m=>{let low=Number(m.stock_qty)<=Number(m.min_stock);return `<div class="item"><div class="row"><div class="grow"><div class="title">${esc(m.name)}</div><div class="meta">Минимум: ${num(m.min_stock)} ${esc(m.unit)} · цена ${money(m.unit_cost)}</div></div><div class="badge ${low?'red':'green'}">${num(m.stock_qty)} ${esc(m.unit)}</div></div></div>`}).join('')||'<div class="empty">Материалы не заведены</div>'}</div>`)}
function renderJobs(){let r=nativeReq('GET','/api/jobs');if(!r.ok)return setContent(errCard(r));setContent(`<div class="sectionHead"><h2>Производственные задания</h2><span class="badge">${r.jobs.length}</span></div><div class="list">${r.jobs.map(j=>{let p=Math.min(100,Math.round(Number(j.done||0)/Math.max(Number(j.target_quantity),1)*100));return `<div class="item"><div class="title">${esc(j.client)} · ${esc(j.operation)}</div><div class="meta">${esc(j.product_name||'Без товара')} · срок ${esc(j.due_at||'не задан')} · приоритет ${j.priority}</div><div style="margin-top:9px;background:#1e293b;border-radius:999px;overflow:hidden;height:9px"><div style="width:${p}%;height:100%;background:#2563eb"></div></div><div class="meta">${num(j.done)} / ${num(j.target_quantity)} · ${p}%</div></div>`}).join('')||'<div class="empty">Открытых заданий нет</div>'}</div>`)}
function renderUsers(){let r=nativeReq('GET','/api/users');if(!r.ok)return setContent(errCard(r));let empOpts='<option value="">Без привязки</option>'+r.employees.map(e=>`<option value="${e.telegram_id}">${esc(e.full_name)} · ${e.telegram_id}</option>`).join('');let roleOpts=Object.entries(r.roles).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');setContent(`<h2>Доступ к приложению</h2><div class="card"><h3>Новый пользователь</h3><div class="field"><div class="label">Логин</div><input id="uLogin"></div><div class="field"><div class="label">Имя</div><input id="uName"></div><div class="field"><div class="label">PIN</div><input id="uPin" type="password" inputmode="numeric"></div><div class="field"><div class="label">Роль</div><select id="uRole">${roleOpts}</select></div><div class="field"><div class="label">Сотрудник PORTAL</div><select id="uTg">${empOpts}</select></div><button class="btn block" onclick="createUser()">Создать доступ</button></div><div class="list">${r.users.map(u=>`<div class="item"><div class="title">${esc(u.display_name)} <span class="badge">${esc(r.roles[u.role]||u.role)}</span></div><div class="meta">${esc(u.username)} · ${u.telegram_id||'без сотрудника'} · ${u.active?'активен':'отключён'}</div></div>`).join('')}</div>`)}
function createUser(){let r=nativeReq('POST','/api/users',{username:uLogin.value.trim(),display_name:uName.value.trim(),pin:uPin.value,role:uRole.value,telegram_id:uTg.value||null});if(!r.ok)return toast(r.error,true);toast('Доступ создан');renderUsers()}
function renderSettings(){setContent(`<h2>Настройки</h2><div class="card"><div class="label">Версия приложения</div><b>${esc(PortalNative.getBuild())}</b><div class="hr"></div><div class="label">Сервер PORTAL</div><b>${esc(PortalNative.getServerUrl())}</b><div style="height:12px"></div><button class="btn secondary block" onclick="openServerSettings()">Изменить адрес сервера</button><div style="height:8px"></div><button class="btn secondary block" onclick="testServer()">Проверить соединение</button></div><div class="card"><h3>Архитектура</h3><p class="muted">APK не зависит от Telegram. Все данные читаются и записываются в существующую базу PORTAL через локальный сервер на телефоне.</p></div>`)}
function testServer(){let r=nativeReq('GET','/api/ping');toast(r.ok?'Сервер работает · '+r.build:(r.error||'Сервер недоступен'),!r.ok)}
checkServer();
</script>
</body>
</html>
