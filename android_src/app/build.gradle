plugins {
    id 'com.android.application'
}

def releaseInfo = new Properties()
rootProject.file('release.properties').withInputStream { releaseInfo.load(it) }
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def buildNumber = providers.environmentVariable('PORTAL_BUILD_NUMBER').orElse(releaseInfo.getProperty('buildNumber')).get()
def buildDate = providers.environmentVariable('PORTAL_BUILD_DATE').orElse(releaseInfo.getProperty('buildDate')).get()
def portalApiUrl = providers.gradleProperty('portalApiUrl').orElse(providers.environmentVariable('PORTAL_API_URL')).orElse('http://127.0.0.1:8765').get()

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.endsWith('Release') }) {
        URI endpoint
        try { endpoint = new URI(portalApiUrl) }
        catch (Exception ignored) { throw new GradleException('Release requires a stable owned HTTPS PORTAL API URL') }
        def host = endpoint.host?.toLowerCase(java.util.Locale.ROOT)
        if (endpoint.scheme != 'https' || !host || endpoint.rawUserInfo ||
                (endpoint.rawPath && endpoint.rawPath != '/') || endpoint.rawQuery || endpoint.rawFragment ||
                !(endpoint.port in [-1, 443]) || host == 'localhost' || host.endsWith('.localhost') ||
                host.endsWith('.sslip.io') || host.endsWith('.trycloudflare.com') ||
                host == 'portal.invalid' || host.contains(':') || (host ==~ /\d+\.\d+\.\d+\.\d+/)) {
            throw new GradleException('Release requires a stable owned HTTPS PORTAL API URL')
        }
    }
}

android {
    namespace 'ru.portal.app'
    compileSdk 35

    def releaseKeystore = System.getenv('PORTAL_ANDROID_KEYSTORE')
    def releaseStorePassword = System.getenv('PORTAL_ANDROID_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('PORTAL_ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('PORTAL_ANDROID_KEY_PASSWORD')
    def releaseKeystoreType = System.getenv('PORTAL_ANDROID_KEYSTORE_TYPE') ?: 'PKCS12'
    def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

    signingConfigs {
        if (releaseSigningReady) {
            portalRelease {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeType releaseKeystoreType
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'ru.portal.app'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        versionCode releaseInfo.getProperty('versionCode').toInteger()
        versionName releaseInfo.getProperty('versionName')
        buildConfigField 'String', 'BUILD_NUMBER', quoted(buildNumber)
        buildConfigField 'String', 'BUILD_DATE', quoted(buildDate)
        buildConfigField 'String', 'RELEASE_CHANNEL', quoted(releaseInfo.getProperty('channel'))
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', quoted(releaseInfo.getProperty('updateManifestUrl', ''))
        buildConfigField 'String', 'SERVER_DISCOVERY_URL', quoted(releaseInfo.getProperty('serverDiscoveryUrl', ''))
        buildConfigField 'String', 'DEFAULT_API_URL', quoted(portalApiUrl)
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true", appLabel: "PORTAL DEV"]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartextTraffic: "false", appLabel: "PORTAL"]
            if (releaseSigningReady) signingConfig signingConfigs.portalRelease
        }
        staging {
            initWith debug
            signingConfig signingConfigs.debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [usesCleartextTraffic: "true", appLabel: "PORTAL STAGING"]
            matchingFallbacks = ["debug"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
