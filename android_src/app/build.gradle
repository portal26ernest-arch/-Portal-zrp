plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.portal.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'ru.portal.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2026.09.24-b002'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
