plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.portal.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.portal.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2026.09.23-b001'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
